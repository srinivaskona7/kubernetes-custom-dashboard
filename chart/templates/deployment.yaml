{{- if and .Values.persistence.enabled (ne .Values.strategy.type "Recreate") }}
{{- fail (printf "strategy.type is %q but persistence.enabled is true. The data PVC is ReadWriteOnce and attaches to one node at a time; a RollingUpdate surge pod can hang in ContainerCreating with 'Multi-Attach error for volume'. Use strategy.type=Recreate, or set persistence.enabled=false with persistence.allowEphemeral=true to accept data loss." .Values.strategy.type) }}
{{- end }}
{{- if and (not .Values.persistence.enabled) (not .Values.persistence.allowEphemeral) }}
{{- fail "persistence.enabled is false: fleet records would be written to ephemeral container storage and lost on every restart. Set persistence.enabled=true, or persistence.allowEphemeral=true to accept that." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8s-fleet-dashboard.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-fleet-dashboard.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: {{ .Values.strategy.type }}
    {{- if eq .Values.strategy.type "Recreate" }}
    rollingUpdate: null
    {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "k8s-fleet-dashboard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pods when the config changes without needing `helm upgrade --force`.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "k8s-fleet-dashboard.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "k8s-fleet-dashboard.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: {{ .Values.service.targetPort | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logging.level | quote }}
            - name: BASE_PATH
              value: {{ .Values.basePath | quote }}
            - name: AUTH_MODE
              value: {{ .Values.auth.mode | quote }}
            {{- if .Values.auth.jwksUrl }}
            - name: OIDC_JWKS_URL
              value: {{ .Values.auth.jwksUrl | quote }}
            {{- end }}
            {{- if .Values.auth.issuer }}
            - name: OIDC_ISSUER
              value: {{ .Values.auth.issuer | quote }}
            {{- end }}
            {{- if .Values.auth.audience }}
            - name: OIDC_AUDIENCE
              value: {{ .Values.auth.audience | quote }}
            {{- end }}
            {{- if .Values.auth.allowedGroups }}
            - name: ALLOWED_GROUPS
              value: {{ .Values.auth.allowedGroups | quote }}
            {{- end }}
            {{- if .Values.auth.adminGroups }}
            - name: FLEET_ADMIN_GROUPS
              value: {{ .Values.auth.adminGroups | quote }}
            {{- end }}
            - name: FLEET_TOKENS_SECRET
              value: {{ default "fleet-dashboard-tokens" .Values.registry.tokensSecret | quote }}
            - name: FLEET_CLUSTERS_SECRET
              value: {{ default "fleet-dashboard-clusters" .Values.registry.clustersSecret | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.persistence.enabled }}
            - name: DB_PATH
              value: "/app/data/app.db"
            {{- end }}
            {{- if .Values.appConfig.existingSecret }}
            - name: APP_CONFIG_FILE
              value: /etc/fleet-dashboard/config.json
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: /app/data
            {{- end }}
            {{- if .Values.appConfig.existingSecret }}
            - name: app-config
              mountPath: /etc/fleet-dashboard
              readOnly: true
            {{- end }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "k8s-fleet-dashboard.fullname" . }}-data
        {{- end }}
        {{- if .Values.appConfig.existingSecret }}
        - name: app-config
          secret:
            secretName: {{ .Values.appConfig.existingSecret }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
