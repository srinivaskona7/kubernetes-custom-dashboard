apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "k8s-fleet-dashboard.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-fleet-dashboard.labels" . | nindent 4 }}
data:
  # Kept non-sensitive on purpose. Credentials belong in a Secret referenced
  # through appConfig.existingSecret, never here.
  auth-mode: {{ .Values.auth.mode | quote }}
  base-path: {{ .Values.basePath | quote }}
  log-level: {{ .Values.logging.level | quote }}
