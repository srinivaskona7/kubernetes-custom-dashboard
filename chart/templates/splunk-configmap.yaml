{{- if .Values.splunk.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "btp-kyma-fleet-dashboard.fullname" . }}-splunk-inputs
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "btp-kyma-fleet-dashboard.labels" . | nindent 4 }}
data:
  inputs.conf: |
    [monitor://{{ .Values.splunk.logPath }}]
    index = {{ .Values.splunk.index }}
    sourcetype = {{ .Values.splunk.sourcetype }}
    blacklist = {{ .Values.splunk.blacklist | default "\\.(gz|zip|bak)$" }}
    ignoreOlderThan = {{ .Values.splunk.ignoreOlderThan | default "3d" }}
{{- end }}
