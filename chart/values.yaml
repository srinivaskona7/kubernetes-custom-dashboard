# Defaults are deliberately portable: no node selectors, no zone pinning, no
# provider-specific annotations, no cloud storage class. Override in a
# values-<cloud>.yaml if you want EKS/AKS/GKE tuning.

# SQLite is single-writer; do not scale beyond 1 replica. See autoscaling below.
replicaCount: 1

# MUST stay Recreate while persistence.enabled is true: the data PVC is
# ReadWriteOnce, and a RollingUpdate surge pod on another node deadlocks with
# "Multi-Attach error for volume". This is true on EBS, Azure Disk and PD alike.
strategy:
  type: Recreate

revisionHistoryLimit: 3

image:
  # Any public registry works: ghcr.io/<org>/k8s-fleet-dashboard,
  # docker.io/<user>/k8s-fleet-dashboard, <account>.dkr.ecr.<region>.amazonaws.com/...
  repository: k8s-fleet-dashboard
  pullPolicy: IfNotPresent
  # Defaults to Chart.AppVersion when empty.
  tag: ""

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  # The app talks to an apiserver with this token, so the token must be mounted.
  automount: true
  # Provider workload-identity annotations go here, e.g.
  #   EKS:   eks.amazonaws.com/role-arn: arn:aws:iam::<acct>:role/<role>
  #   GKE:   iam.gke.io/gcp-service-account: <sa>@<project>.iam.gserviceaccount.com
  #   AKS:   azure.workload.identity/client-id: <client-id>
  annotations: {}

rbac:
  # Cluster-wide read access is what makes the dashboard useful: it lists
  # namespaces, nodes, workloads and events across every namespace. Scope it
  # down with `clusterRole.rules` if your policy requires it.
  create: true
  clusterRole:
    name: ""
  # Secrets are read for Helm release metadata. Every value the UI renders is
  # redacted server-side, but the token itself is cluster-wide, so treat the
  # ServiceAccount as privileged for a read-only role.
  readSecrets: true

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 3001
  targetPort: 3001

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Sub-path the app is served under. Must match VITE_BASE_PATH used at image
# build time; leave "/" unless you built the image with a prefix.
basePath: /

persistence:
  # Fleet records and the app database live in SQLite at DB_PATH.
  enabled: true
  # Disabling persistence writes to ephemeral container storage and loses the
  # registry on every restart. The chart refuses to render that unless
  # allowEphemeral is set.
  allowEphemeral: false
  size: 1Gi
  # Empty = the cluster's default StorageClass, which is the portable choice:
  # EKS uses gp2/gp3, AKS managed-csi, GKE standard-rwo.
  storageClass: ""
  accessMode: ReadWriteOnce

auth:
  # none | oidc. `none` is refused when NODE_ENV=production, so a real
  # deployment needs `oidc` unless it sits behind an authenticating proxy.
  mode: oidc
  # Required when mode=oidc: the issuer's public JWKS endpoint.
  jwksUrl: ""
  issuer: ""
  audience: ""
  # Comma-separated groups matched against the token's `groups` claim.
  # Empty means any authenticated user may read.
  allowedGroups: ""
  # Groups allowed to add/remove clusters and renew credentials.
  adminGroups: ""

# Names of the Secrets the app writes the fleet registry into. They live in the
# release namespace and are created on first write.
registry:
  tokensSecret: fleet-dashboard-tokens
  clustersSecret: fleet-dashboard-clusters


# Extra environment variables, as a list of {name, value} or {name, valueFrom}.
extraEnv: []

# A JSON config file mounted from a ConfigMap or Secret, if you keep the
# cluster registry outside the database.
appConfig:
  existingSecret: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1
    memory: 512Mi

# Keep disabled while persistence is enabled: SQLite on a ReadWriteOnce volume
# supports a single replica.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Disabled by default: NetworkPolicy is enforced by the CNI, and the addon
# differs across EKS (VPC CNI + policy agent), AKS and GKE. Enable it only
# after checking your datapath enforces policy.
networkPolicy:
  enabled: false
  ingress: []
  egress: []

nodeSelector: {}
tolerations: []
affinity: {}

logging:
  level: info

commonLabels: {}
