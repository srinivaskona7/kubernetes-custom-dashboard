# SQLite is single-writer; do not scale beyond 1 replica.
replicaCount: 1

# MUST stay Recreate while persistence.enabled is true (the chart fails to render
# otherwise): the data PVC is ReadWriteOnce, and a RollingUpdate surge pod on a
# different node deadlocks with "Multi-Attach error for volume".
strategy:
  type: Recreate

revisionHistoryLimit: 3

image:
  repository: 637248970961.dkr.ecr.us-west-2.amazonaws.com/btp-kyma-fleet-dashboard
  pullPolicy: Always
  tag: latest

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: "btp-kyma-fleet-dashboard"
  automount: false
  annotations: {}

podAnnotations: {}

podSecurityContext:
  fsGroup: 266

# UID 265 matches the nonroot user in Apple UBI9 runtime base image
securityContext:
  runAsNonRoot: true
  runAsUser: 265
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# ClusterIP service. See shield-config/ and NOTES.txt for routing setup.
service:
  type: ClusterIP
  port: 3001
  targetPort: 3001

# Narrative CSI driver — auto-provisions the pod's TLS identity at /tls
# (tls.crt, tls.key, ca.crt), used as the Whisper mTLS client certificate.
# With podIdentity "true" this is the service-account pod identity (no person
# DSID). The certificate's APRN is
#   aprn:apple:aws:us-west-2:<account>:eks-service-account:dev-slm-datahub/btp-kyma-fleet-dashboard/btp-kyma-fleet-dashboard
# (cluster/namespace/serviceAccount) regardless of `name`. Grant THAT APRN read
# on the Whisper secret.
narrative:
  type: "actor"
  domain: "aws"
  name: "btp-kyma-fleet-dashboard"
  podIdentity: "true"
  fsGroup: "266"

# Whisper configuration (passed as env vars)
whisper:
  secretName: "btp-kyma-fleet-dashboard-prod"
  namespace: "btp-pltform-security"

# SQLite data volume, mounted at /app/data (DB_PATH=/app/data/app.db).
# Disabling it writes the DB to ephemeral container storage, LOST on every pod
# restart — the chart refuses to render that unless allowEphemeral=true.
persistence:
  enabled: true
  allowEphemeral: false
  size: 1Gi
  storageClass: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}

# Keep disabled — SQLite on a ReadWriteOnce volume supports a single replica.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80

nodeSelector:
  topology.kubernetes.io/zone: us-west-2c

tolerations: []

affinity: {}

splunk:
  enabled: true
  image: docker.apple.com/splunk-ist/splunk-universalforwarder:latest
  cluster: ist_prod
  logPath: "/logs/*.log"
  index: btp_platform_apps
  sourcetype: btp_kyma_fleet_dashboard
  blacklist: "\\.(gz|zip|bak)$"
  ignoreOlderThan: "3d"

networkPolicy:
  enabled: true
  splunkManagementCIDRs:
    - "10.202.186.16/32"
    - "10.202.184.21/32"
  splunkIndexerCIDRs:
    - "10.110.168.0/21"
    - "10.202.56.0/21"

auth:
  allowedGroups: "12421088"

logging:
  level: "info"
