# Narrative TLS issuer for the application namespace.
#
# Apply once per namespace (requires admin kubectl context):
#   kubectl apply -n <namespace> -f scripts/narrative-issuer.yaml
#
# Verify:
#   kubectl get narrativeissuer -n <namespace>
#
# Required by the Narrative CSI driver to provision /tls certs into pods.
# The issuer declares a `platform` identity attested by AWS instance identity
# (awsiid); the EKS node provides the attestation automatically.
apiVersion: ais-sre.apple.com/v1beta1
kind: NarrativeIssuer
metadata:
  name: narrative-issuer
spec:
  identities:
    - ref: platform
      type: platform
      domain: aws
      nameAutodetect: true
      identityAttestor: awsiid
