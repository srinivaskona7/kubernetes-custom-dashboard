directory: {{CERT_DIR}}
identities:
  - ref: platform
    unix_socket: AppleConnect
    unmanaged: true
    type: platform
    domain: idms
  - ref: actor
    unix_socket: AppleConnect
    unmanaged: true
    type: actor
    domain: idms
    name: aprn:apple:idms:::person:{{PERSON_DSID}}
  - ref: system-actor
    type: actor
    domain: idms
    name_json:
      type: person
      person_id: {{SYSTEM_DSID}}
    identity_attestor: $actor
